<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Budget ring: a glass ring filling up as you spend, with the house in the middle.
       Full-bleed square (iPhone rounds the corners). Everything sits inside the middle 80%, so it also works
       as a maskable icon. After changing this, run: node tools/make-icons.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A6FF"/>
      <stop offset="0.55" stop-color="#F7B2D3"/>
      <stop offset="1" stop-color="#FFD2BC"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A5C"/>
      <stop offset="1" stop-color="#E8336F"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="13"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round"
    pathLength="100" stroke-dasharray="49 100" transform="rotate(-90 50 50)"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8"/>
  <circle cx="50" cy="50" r="20.5" fill="url(#disc)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8"/>
  <path d="M28 36a26 26 0 0 1 14-11" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="39.5,51 50,41 60.5,51" fill="#FFFFFF"/>
  <rect x="42.5" y="51" width="15" height="10" fill="#FFFFFF"/>
  <rect x="48" y="54.5" width="4" height="6.5" fill="#F2557A"/>
</svg>
